services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeThis_StrongPassword123!"
    ports: ["1433:1433"]
    volumes: ["sql_data:/var/opt/mssql"]
  api:
    build: ./RaceDay.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceDay: "Server=sql;Database=RaceDayDB;User Id=sa;Password=ChangeThis_StrongPassword123!;TrustServerCertificate=True"
      Jwt__Key: "REPLACE_WITH_LONG_RANDOM_SECRET_BEFORE_DEPLOYMENT"
      AzureBlob__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING:-}"
    ports: ["8081:8080"]
    depends_on: [sql]
  mvc:
    build: ./RaceDayMVC_Rebuilt
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports: ["8080:8080"]
    depends_on: [api]
volumes:
  sql_data:
